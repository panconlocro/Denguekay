name: Calidad del backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Python 3.12 / ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Fuerza la ruta CPU reproducible para pruebas; no usa credenciales reales.
      DENGUEKAY_XGB_DEVICE: cpu
      DENGUEKAY_XGB_NJOBS: "2"
      MPLBACKEND: Agg
      DATABASE_URL: ""
      API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Instalar el paquete denguekay en modo editable
        run: python -m pip install -e . --no-deps
      - name: Comprobar dependencias instaladas
        run: python -m pip check
      - name: Ejecutar todos los tests con cobertura
        run: python -m coverage run -m unittest discover -s tests
      - name: Exigir cobertura mínima del backend
        run: python -m coverage report --fail-under=80
      - name: Exigir cobertura de API
        run: python -m coverage report --include="apps/api/*" --fail-under=80
      - name: Exigir cobertura de inferencia
        run: python -m coverage report --include="src/denguekay/serving/*" --fail-under=80
      - name: Exigir cobertura de base de datos
        run: python -m coverage report --include="src/denguekay/db/*" --fail-under=80
      - name: Exportar cobertura para revisión
        if: always()
        run: python -m coverage xml
      - name: Conservar reporte por sistema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ matrix.sistema }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  postgresql:
    # Los contenedores de servicio de GitHub Actions solo existen en Linux.
    name: Python 3.12 / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: denguekay_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d denguekay_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DENGUEKAY_XGB_DEVICE: cpu
      DENGUEKAY_XGB_NJOBS: "2"
      MPLBACKEND: Agg
      DATABASE_URL: ""
      API_KEY: ""
      # BD desechable del contenedor; el nombre contiene «prueba» como exige tests/backend_support.py.
      DENGUEKAY_PG_PRUEBAS_URL: postgresql+psycopg://postgres:postgres@localhost:5432/denguekay_pruebas
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Instalar el paquete denguekay en modo editable
        run: python -m pip install -e . --no-deps
      - name: Ejecutar todos los tests, incluidas las pruebas y guardas de equivalencia en PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee pruebas.log
      - name: Exigir que las pruebas en PostgreSQL no se omitan
        shell: bash
        run: |
          if grep -q "Sin DENGUEKAY_PG_PRUEBAS_URL" pruebas.log; then
            echo "Las pruebas en PostgreSQL se omitieron" >&2
            exit 1
          fi
          n=$(grep -cE "\((db\.test_oe2_schema\.TestEsquemaOE2PostgreSQL|serving\.test_inference\.TestInferenciaPostgreSQL)\.[^)]*\) \.\.\. ok$" pruebas.log || true)
          echo "Pruebas en PostgreSQL aprobadas: $n"
          test "$n" -gt 0
          # Guarda de la reestructuración: el esquema migrado en PostgreSQL es el de la línea base.
          grep -qE "\(test_equivalence\.TestMigratedSchema\.test_postgresql_schema_matches_baseline\) \.\.\. ok$" pruebas.log
