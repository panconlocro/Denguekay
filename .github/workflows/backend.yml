name: Calidad del backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Python 3.12 / ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Fuerza la ruta CPU reproducible para pruebas; no usa credenciales reales.
      DENGUEKAY_XGB_DEVICE: cpu
      DENGUEKAY_XGB_NJOBS: "2"
      MPLBACKEND: Agg
      DATABASE_URL: ""
      API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Comprobar dependencias instaladas
        run: python -m pip check
      - name: Ejecutar todos los tests con cobertura
        run: python -m coverage run -m unittest discover -s tests
      - name: Exigir cobertura mínima del backend
        run: python -m coverage report --fail-under=80
      - name: Exigir cobertura de API
        run: python -m coverage report --include="src/api/*" --fail-under=80
      - name: Exigir cobertura de inferencia
        run: python -m coverage report --include="src/serving/*" --fail-under=80
      - name: Exigir cobertura de base de datos
        run: python -m coverage report --include="src/db/*" --fail-under=80
      - name: Exportar cobertura para revisión
        if: always()
        run: python -m coverage xml
      - name: Conservar reporte por sistema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ matrix.sistema }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
