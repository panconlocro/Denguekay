name: Calidad del frontend

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar:
    name: Detectar paquete del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hasweb: ${{ steps.web.outputs.hasweb }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detectar apps/web/package.json
        id: web
        shell: bash
        run: |
          if [[ -f apps/web/package.json ]]; then
            echo "hasweb=true" >> "$GITHUB_OUTPUT"
            echo "Paquete frontend presente; se ejecutará su CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hasweb=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI frontend omitido: falta apps/web/package.json; integrar la rama frontend para ejecutar las comprobaciones."
            echo "CI frontend OMITIDO: falta apps/web/package.json. No se ejecutaron instalación, contrato, lint, formato, tests, build ni E2E. Esta omisión no valida el frontend." >> "$GITHUB_STEP_SUMMARY"
          fi

  pruebas:
    name: Node 22 / Python 3.12 / Chromium (fixtures)
    needs: detectar
    if: needs.detectar.outputs.hasweb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    env:
      CI: "true"
      VITE_DATA_SOURCE: fixtures
      VITE_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://127.0.0.1:18000
      WEB_TEST_SOURCE: fixtures
      DATABASE_URL: ""
      API_KEY: ""
      DENGUEKAY_XGB_DEVICE: cpu
      DENGUEKAY_XGB_NJOBS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      # The fixture API uses the full backend and small model tests, not research.
      - name: Instalar dependencias Python de las fixtures
        working-directory: .
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Instalar frontend desde el lockfile
        run: npm ci
      - name: Regenerar tipos y exigir contrato sin diferencias
        run: |
          git ls-files --error-unmatch ./src/api/schema.d.ts
          npm run api:generate
          git diff --exit-code -- ./src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Pruebas unitarias
        run: npm test
      - name: Build y comprobación TypeScript
        run: npm run build
      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install --with-deps chromium
      - name: E2E con API temporal de fixtures
        working-directory: .
        run: |
          python apps/web/e2e/serve_api.py > "$RUNNER_TEMP/frontend-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ready=false
          for attempt in $(seq 1 120); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:18000/api/v1/salud > "$RUNNER_TEMP/frontend-api-health.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "La API temporal no está disponible en el puerto 18000." >&2
            cat "$RUNNER_TEMP/frontend-api.log"
            exit 1
          fi
          cd apps/web
          npm run test:e2e
      - name: Conservar diagnóstico de fallos y trazas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-fallos-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            ${{ runner.temp }}/frontend-api.log
            ${{ runner.temp }}/frontend-api-health.json
          if-no-files-found: warn
          retention-days: 14
