# Config central del proyecto.
# No pongas datos sensibles acá si el repo es público — para IDs de Drive
# no hay problema (no dan acceso, solo identifican el archivo, y los Excel
# ya son compartidos con el equipo), pero si prefieres, muévelos a un .env.

drive:
  # ID del archivo de Google Drive (no de la carpeta).
  # Se obtiene del link: drive.google.com/file/d/<ESTE_ID>/view
  epi_file_id: "1vSPn8SqR4ioz-uDj7HKmem6mgWexin8V"
  socio_file_id: "1x4NoX2vJEs_g3SQyZkfFFwvxTbXO4OBn"

meteo:
  fecha_inicio: "2017-01-01"
  fecha_fin: "2025-12-31"
  batch_size: 20

xgboost:
  # auto = GPU NVIDIA (CUDA) si existe; si no, CPU. Opciones: auto | cuda | cpu.
  # En Mac (Apple Silicon) XGBoost no usa la GPU: auto cae a CPU sin error.
  device: auto
  # auto = todos los núcleos de la CPU. No cambia los resultados.
  n_jobs: auto

serving:
  # Paquete de modelo que construye la publicación (denguekay.serving.predictors): tipo de predictor,
  # horizontes y opciones propias del tipo. v2_e3_s4 = modelo v2 (CONFIG_2026, E3 multisalida S4_s3);
  # nivel_intervalo debe coincidir con parametro_sistema.nivel_intervalo_casos. La v0 sigue registrada
  # como tipo v0_compact_xgb (opciones: variantes del protocolo compacto).
  paquete:
    tipo: v2_e3_s4
    horizontes: [2, 3, 4]
    opciones:
      configuracion: v2
      nivel_intervalo: 0.80
  # Demo experimental (desviación temporal OE2): si no hay versión activa, se sirve la
  # selección de parametro_sistema.seleccion_experimental, que fija la publicación
  # (python -m denguekay.serving.publish --seleccionar-experimental).
  servir_no_validadas: true
  # Orígenes del frontend admitidos por CORS (esquema://servidor[:puerto], sin barra final).
  cors_origenes: ["http://localhost:5173"]
  # Dónde están los paquetes de modelo: local (models/storage/) o supabase (Supabase Storage).
  almacenamiento: local
  # El entorno reemplaza estos tres valores: CORS_ORIGINS (separados por comas), SERVIR_NO_VALIDADAS
  # y STORAGE_BACKEND (ver .env.example y docs/backend/despliegue.md).
  # Cortes de riesgo, umbrales de aceptación (bloque temporada_2024) y regla de
  # brote viven en parametro_sistema; los siembra la migración 0003_oe2.
